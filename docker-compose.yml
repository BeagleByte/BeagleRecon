services:
  vulnerable:
    image: heywoodlh/vulnerable
    container_name: beaglerecon-vulnerable
    ports:
      - "127.0.0.1:21:21"      # ProFTPD
      - "127.0.0.1:22:22"      # OpenSSH
      - "127.0.0.1:80:80"      # Apache
      - "127.0.0.1:445:445"    # Samba
      - "127.0.0.1:631:631"    # CUPS
      - "127.0.0.1:3000:3000"  # chatbot
      - "127.0.0.1:3500:3500"  # readme_app
      - "127.0.0.1:6697:6697"  # UnrealIRC
      - "127.0.0.1:3306:3306"  # MySQL
      - "127.0.0.1:8181:8181"  # Sinatra
    restart: unless-stopped

  beaglerecon:
    build: .
    image: beaglerecon:latest
    profiles: ["scan"]
    environment:
      MIN_CVE_YEAR: ${MIN_CVE_YEAR:-2010}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
